<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="header">
        <div class="top">
            <div class="header-logo">Header Logo</div>
            <div class="header-links">
                <a class="link-one">header link one</a>
                <a class="link-two">header link two</a>
                <a class="link-three">header link three</a>
            </div>
        </div>
        <div class="header-info">

                <div class="header-info-title">This website is awesome</div>

        </div>
    </div>
    <div class="information"></div>
    <div class="quote"></div>
    <div class="footer"></div>
